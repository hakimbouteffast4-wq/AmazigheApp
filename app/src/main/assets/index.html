<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>أفعال الكلام | أيت يوسي</title>
    <link rel="stylesheet" href="style.css?v=5.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="entrance-anim">
    <div class="orb orb-1"></div>

    <!-- القائمة الجانبية -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>أفعال الكلام</h2>
            <span>دراسة تداولية</span>
        </div>
        <nav class="sidebar-nav">
            <a href="javascript:void(0)" onclick="switchPane('pane-lexicon', this); toggleSidebar()"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="javascript:void(0)" onclick="switchPane('about-pane', this); toggleSidebar()"><i class="fas fa-info-circle"></i> حول الدراسة</a>
            <a href="javascript:void(0)" onclick="switchPane('contact-pane', this); toggleSidebar()"><i class="fas fa-envelope"></i> اتصل بنا</a>

            <div style="margin-top: auto; padding: 1.5rem;">
                <button onclick="switchPane('admin-pane', this); toggleSidebar()" class="admin-btn-nav" style="width: 100%; padding: 1rem; border-radius: 12px; background: rgba(212, 163, 115, 0.1); border: 1px solid var(--gold); color: var(--gold); font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <i class="fas fa-user-shield"></i> لوحة المشرف
                </button>
            </div>
        </nav>
    </aside>

    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <header class="navbar">
        <div class="nav-container">
            <div style="display: flex; gap: 10px; align-items: center; width: 100px;">
                <button id="back-btn" class="trigger-btn" onclick="navigateBack()" style="display:none;"><i class="fas fa-arrow-right"></i></button>
                <button id="menu-btn" class="trigger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            </div>
            <div class="brand-pinnacle" onclick="location.reload()">
                <h1>أفعال الكلام</h1>
                <span>تراث أيت يوسي</span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; justify-content: flex-end; width: 100px;">
                <button class="trigger-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </header>

    <main class="main-master-wrapper" style="padding: 1.5rem; position: relative; z-index: 1;">
        <div id="pane-lexicon" class="pane-container active">
            <div id="category-grid" class="speech-act-grid">
                <div class="act-category-card" onclick="setSearchCategory('tales')"><i class="fas fa-book-open"></i><h3>الحكايات</h3></div>
                <div class="act-category-card" onclick="setSearchCategory('izlan')"><i class="fas fa-music"></i><h3>إيزلان</h3></div>
                <div class="act-category-card" onclick="setSearchCategory('proverbs')"><i class="fas fa-comments"></i><h3>أمثال شعبية</h3></div>
                <div class="act-category-card" onclick="setSearchCategory('riddles')"><i class="fas fa-puzzle-piece"></i><h3>الألغاز</h3></div>
                <div class="act-category-card" onclick="setSearchCategory('idioms')"><i class="fas fa-quote-right"></i><h3>تعابير مسكوكة</h3></div>
            </div>
            <div id="results-nexus"></div>
        </div>

        <div id="about-pane" class="pane-container" style="display:none;">
            <div class="contact-card ultimate-reveal"><h2>حول الدراسة</h2><p>أرشفة رقمية وتحليل لساني تداولي للتراث الشفهي.</p></div>
        </div>

        <div id="contact-pane" class="pane-container" style="display:none;">
            <div class="contact-card ultimate-reveal"><h2>اتصل بنا</h2><p>البريد: hakimed.b@gmail.com</p></div>
        </div>

        <div id="admin-pane" class="pane-container" style="display:none;">
            <div class="contact-card ultimate-reveal"><h2>لوحة التحكم</h2><p>إدارة البيانات السحابية.</p></div>
        </div>
    </main>

    <!-- مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=5.2"></script>
</body>
</html>
