<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أفعال الكلام | أيت يوسي</title>
    <link rel="stylesheet" href="style.css?v=10.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="entrance-anim">
    <div class="orb orb-1"></div>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header"><h2>أفعال الكلام</h2><span>دراسة تداولية</span></div>
        <nav class="sidebar-nav">
            <a href="javascript:void(0)" onclick="window.switchPane('pane-lexicon'); window.toggleSidebar()"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="javascript:void(0)" onclick="window.switchPane('about-pane'); window.toggleSidebar()"><i class="fas fa-info-circle"></i> حول الدراسة</a>
            <a href="javascript:void(0)" onclick="window.switchPane('contact-pane'); window.toggleSidebar()"><i class="fas fa-envelope"></i> اتصل بنا</a>
            <a href="javascript:void(0)" onclick="window.switchPane('admin-pane'); window.toggleSidebar()">
                <i class="fas fa-user-shield"></i> لوحة المشرف
            </a>
        </nav>
    </aside>

    <div id="overlay" class="overlay" onclick="window.toggleSidebar()"></div>

    <header class="navbar">
        <div class="nav-container">
            <div style="display:flex; gap:10px; align-items:center; width:80px;">
                <button id="back-btn" class="trigger-btn" onclick="window.navigateBack()" style="display:none;"><i class="fas fa-arrow-right"></i></button>
                <button id="menu-btn" class="trigger-btn" onclick="window.toggleSidebar()"><i class="fas fa-bars"></i></button>
            </div>
            <div class="brand-pinnacle" onclick="location.reload()"><h1>أفعال الكلام</h1><span>أيت يوسي</span></div>
            <div style="width:80px; display:flex; justify-content:flex-end;">
                <button class="trigger-btn" onclick="window.toggleTheme()"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </header>

    <main class="main-master-wrapper" style="padding:1.5rem; position:relative; z-index:1;">
        <div id="pane-lexicon" class="pane-container active">
            <div id="category-grid" class="speech-act-grid">
                <div class="act-category-card" onclick="window.setSearchCategory('tales')"><i class="fas fa-book-open"></i><h3>الحكايات</h3></div>
                <div class="act-category-card" onclick="window.setSearchCategory('izlan')"><i class="fas fa-music"></i><h3>إيزلان</h3></div>
                <div class="act-category-card" onclick="window.setSearchCategory('proverbs')"><i class="fas fa-comments"></i><h3>أمثال شعبية</h3></div>
                <div class="act-category-card" onclick="window.setSearchCategory('riddles')"><i class="fas fa-puzzle-piece"></i><h3>الألغاز</h3></div>
                <div class="act-category-card" onclick="window.setSearchCategory('idioms')"><i class="fas fa-quote-right"></i><h3>تعابير مسكوكة</h3></div>
            </div>
            <div id="results-nexus"></div>
        </div>

        <div id="about-pane" class="pane-container" style="display:none;"><div class="contact-card"><h2>حول الدراسة</h2><p>تحليل لساني تداولي للتراث الشفهي.</p></div></div>
        <div id="contact-pane" class="pane-container" style="display:none;"><div class="contact-card"><h2>اتصل بنا</h2><p>hakimed.b@gmail.com</p></div></div>

        <div id="admin-pane" class="pane-container" style="display:none;">
            <div class="contact-card" style="border-top:4px solid #d4a373; padding: 1.5rem;">
                <h2 style="margin-bottom: 1rem;">إضافة متن جديد</h2>
                <input type="text" id="expressionInput" placeholder="الشاهد الأمازيغي (Expression)...">
                <select id="categoryInput" style="width:100%; margin-bottom:1rem; padding:12px; border-radius:8px; background: white; color: black; font-weight: bold;">
                    <option value="proverbs">أمثال شعبية</option>
                    <option value="izlan">إيزلان</option>
                    <option value="tales">الحكايات</option>
                    <option value="riddles">الألغاز</option>
                    <option value="idioms">تعابير مسكوكة</option>
                </select>
                <textarea id="meaningInput" rows="2" placeholder="المعنى التداولي (Meaning)..."></textarea>
                <button onclick="window.handleSaveBtn()" id="save-btn" style="width:100%; padding:15px; background:#d4a373; color:black; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">
                    <i class="fas fa-cloud-upload-alt"></i> حفظ في السحاب
                </button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=10.0"></script>
</body>
</html>
